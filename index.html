<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sabina AI - Интеллектуалды көмекші</title>
    <!-- FontAwesome Icon Library -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }

        .chat-container {
            width: 100%;
            max-width: 850px;
            height: 90vh;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.12);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            margin: 15px;
        }

        /* Header */
        .chat-header {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: #ffffff;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 42px;
            height: 42px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .header-text h2 {
            font-size: 18px;
            font-weight: 600;
        }

        .header-text p {
            font-size: 12px;
            opacity: 0.85;
        }

        .header-actions button {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.2s;
        }

        .header-actions button:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        /* Messages Area */
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background: #fdfdfd;
        }

        .message-row {
            display: flex;
            flex-direction: column;
            max-width: 80%;
        }

        .user-row {
            align-self: flex-end;
            align-items: flex-end;
        }

        .bot-row {
            align-self: flex-start;
            align-items: flex-start;
        }

        .message-bubble {
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 15px;
            line-height: 1.5;
            word-break: break-word;
            position: relative;
        }

        .user-bubble {
            background-color: #6366f1;
            color: #ffffff;
            border-bottom-right-radius: 2px;
        }

        .bot-bubble {
            background-color: #f1f5f9;
            color: #1e293b;
            border-bottom-left-radius: 2px;
            border: 1px solid #e2e8f0;
        }

        .copy-btn {
            margin-top: 5px;
            background: transparent;
            border: none;
            color: #64748b;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .copy-btn:hover {
            color: #6366f1;
        }

        /* Typing Indicator */
        .typing {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
            background: #f1f5f9;
            border-radius: 14px;
            width: fit-content;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: #94a3b8;
            border-radius: 50%;
            animation: bounce 1.3s infinite ease-in-out;
        }

        .dot:nth-child(2) { animation-delay: 0.15s; }
        .dot:nth-child(3) { animation-delay: 0.3s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-6px); }
        }

        /* Suggestions */
        .suggestions {
            display: flex;
            gap: 8px;
            padding: 10px 20px;
            overflow-x: auto;
            background: #ffffff;
            border-top: 1px solid #f1f5f9;
        }

        .chip {
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
            color: #334155;
        }

        .chip:hover {
            background: #6366f1;
            color: white;
            border-color: #6366f1;
        }

        /* Input Controls */
        .chat-input-container {
            padding: 16px 20px;
            background: #ffffff;
            border-top: 1px solid #f1f5f9;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .chat-input {
            flex: 1;
            padding: 12px 18px;
            border: 1.5px solid #cbd5e1;
            border-radius: 24px;
            outline: none;
            font-size: 15px;
            transition: border-color 0.2s;
        }

        .chat-input:focus {
            border-color: #6366f1;
        }

        .send-btn {
            background: #6366f1;
            color: white;
            border: none;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: background 0.2s;
        }

        .send-btn:hover {
            background: #4f46e5;
        }

        /* Scrollbar styles */
        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }
        .chat-messages::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 3px;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <!-- Header -->
    <div class="chat-header">
        <div class="header-info">
            <div class="avatar"><i class="fas fa-robot"></i></div>
            <div class="header-text">
                <h2>Sabina AI</h2>
                <p>Сіздің ақылды әрі жылдам көмекшіңіз</p>
            </div>
        </div>
        <div class="header-actions">
            <button onclick="clearChat()"><i class="fas fa-trash"></i> Тазалау</button>
        </div>
    </div>

    <!-- Messages -->
    <div class="chat-messages" id="chatMessages">
        <div class="message-row bot-row">
            <div class="message-bubble bot-bubble">
                Сәлеметсіз бе! Мен Sabina AI көмекшісімін. Сізге қандай сұрақ немесе тапсырма бойынша көмек керек? Сұрағыңызды жазыңыз, бірден дайын жауап беремін!
            </div>
        </div>
    </div>

    <!-- Quick Suggestions -->
    <div class="suggestions">
        <div class="chip" onclick="quickSend('Маған қысқаша эссе жазып берші')">📝 Эссе жазу</div>
        <div class="chip" onclick="quickSend('Мына тақырыпты түсіндіріп бер')">💡 Түсіндіріп беру</div>
        <div class="chip" onclick="quickSend('Мәтіндегі грамматикалық қателерді түзеп бер')">🔍 Мәтін тексеру</div>
    </div>

    <!-- Input Area -->
    <div class="chat-input-container">
        <input type="text" id="userInput" class="chat-input" placeholder="Сұрағыңызды осында жазыңыз..." onkeypress="handleKeyPress(event)">
        <button class="send-btn" onclick="sendMessage()">
            <i class="fas fa-paper-plane"></i>
        </button>
    </div>
</div>

<script>
    // ЖҮЙЕЛІК НҰСҚАУЛЫҚ (AI-ға ақыл айтқызбай, дайын жауап бергізу үшін)
    const SYSTEM_PROMPT = "Сен — сыпайы, нақты әрі практик AI-ассистентсің. Пайдаланушыға сұрақты қалай қою керектігін үйретпе, ақыл айтпа және уақытын алма. Қойылған сұрақтың мәнін бірден түсініп, дайын, толық әрі сапалы жауап ұсын.";

    // Егер OpenAI API қолдансаңыз, осы жерге кілтті қоюға болады немесе Backend сервиске бағыттауға болады
    const API_KEY = ""; // Бұл жерге API KEY қоюға болады

    async function sendMessage() {
        const input = document.getElementById('userInput');
        const text = input.value.trim();
        if (!text) return;

        // 1. Пайдаланушы хабарламасын шығару
        appendUserMessage(text);
        input.value = '';

        // 2. "Жазып жатыр..." индикаторын қосу
        showTypingIndicator();

        // 3. AI Жауабын алу
        if (API_KEY) {
            try {
                const response = await fetch("https://api.openai.com/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${API_KEY}`
                    },
                    body: JSON.stringify({
                        model: "gpt-3.5-turbo",
                        messages: [
                            { role: "system", content: SYSTEM_PROMPT },
                            { role: "user", content: text }
                        ]
                    })
                });
                const data = await response.json();
                removeTypingIndicator();
                const aiReply = data.choices[0].message.content;
                appendBotMessage(aiReply);
            } catch (error) {
                removeTypingIndicator();
                appendBotMessage("Кешіріңіз, байланыс қатесі орын алды. Қайталап көріңіз.");
            }
        } else {
            // Эмуляция (API кілт қосылмаған жағдайда)
            setTimeout(() => {
                removeTypingIndicator();
                appendBotMessage("Міне, сіздің сұрағыңыз бойынша дайын жауап:\n\n" + text + " мәселесі бойынша барлық қажетті ақпарат реттелді. Қосымша сұрағыңыз болса, көмектесуге дайынмын!");
            }, 1000);
        }
    }

    function appendUserMessage(text) {
        const messagesDiv = document.getElementById('chatMessages');
        const row = document.createElement('div');
        row.className = 'message-row user-row';
        row.innerHTML = `<div class="message-bubble user-bubble">${escapeHtml(text)}</div>`;
        messagesDiv.appendChild(row);
        scrollToBottom();
    }

    function appendBotMessage(text) {
        const messagesDiv = document.getElementById('chatMessages');
        const row = document.createElement('div');
        row.className = 'message-row bot-row';
        
        const bubble = document.createElement('div');
        bubble.className = 'message-bubble bot-bubble';
        bubble.innerText = text;

        const copyBtn = document.createElement('button');
        copyBtn.className = 'copy-btn';
        copyBtn.innerHTML = `<i class="far fa-copy"></i> Көшіріп алу`;
        copyBtn.onclick = () => {
            navigator.clipboard.writeText(text);
            copyBtn.innerHTML = `<i class="fas fa-check"></i> Көшірілді!`;
            setTimeout(() => {
                copyBtn.innerHTML = `<i class="far fa-copy"></i> Көшіріп алу`;
            }, 2000);
        };

        row.appendChild(bubble);
        row.appendChild(copyBtn);
        messagesDiv.appendChild(row);
        scrollToBottom();
    }

    function showTypingIndicator() {
        const messagesDiv = document.getElementById('chatMessages');
        const typingDiv = document.createElement('div');
        typingDiv.id = 'typingIndicator';
        typingDiv.className = 'message-row bot-row';
        typingDiv.innerHTML = `
            <div class="typing">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        `;
        messagesDiv.appendChild(typingDiv);
        scrollToBottom();
    }

    function removeTypingIndicator() {
        const indicator = document.getElementById('typingIndicator');
        if (indicator) indicator.remove();
    }

    function quickSend(text) {
        document.getElementById('userInput').value = text;
        sendMessage();
    }

    function handleKeyPress(event) {
        if (event.key === 'Enter') {
            sendMessage();
        }
    }

    function clearChat() {
        const messagesDiv = document.getElementById('chatMessages');
        messagesDiv.innerHTML = `
            <div class="message-row bot-row">
                <div class="message-bubble bot-bubble">
                    Чат тазаланды. Сұрағыңызды қоя беріңіз!
                </div>
            </div>
        `;
    }

    function scrollToBottom() {
        const messagesDiv = document.getElementById('chatMessages');
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function escapeHtml(text) {
        return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
</script>

</body>
</html>
