<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sabina AI — Enterprise Psychological Platform</title>
  
  <!-- Font Awesome & Google Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-main: #090d16;
      --bg-card: rgba(18, 24, 38, 0.7);
      --bg-glass: rgba(255, 255, 255, 0.03);
      --border-color: rgba(255, 255, 255, 0.08);
      --border-highlight: rgba(236, 72, 153, 0.3);
      
      --accent-primary: #ec4899;
      --accent-secondary: #8b5cf6;
      --accent-gradient: linear-gradient(135deg, #ec4899 0%, #8b5cf6 100%);
      
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      
      --sidebar-width: 320px;
      --right-panel-width: 340px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* GLASS EFFECT */
    .glass {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
    }

    /* LEFT SIDEBAR */
    .sidebar {
      width: var(--sidebar-width);
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border-color);
      z-index: 10;
    }

    .brand-header {
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--accent-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      color: #fff;
      box-shadow: 0 0 15px rgba(236, 72, 153, 0.4);
    }

    .brand-title {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .action-btn {
      margin: 15px;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .action-btn:hover {
      background: var(--accent-gradient);
      border-color: transparent;
      box-shadow: 0 4px 15px rgba(236, 72, 153, 0.3);
    }

    .session-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 15px;
    }

    .session-item {
      padding: 12px 15px;
      border-radius: 8px;
      margin-bottom: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--text-muted);
      transition: all 0.2s ease;
      font-size: 0.9rem;
    }

    .session-item:hover, .session-item.active {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
    }

    .session-item.active {
      border-left: 3px solid var(--accent-primary);
    }

    /* MAIN CHAT AREA */
    .main-chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .chat-header {
      padding: 18px 25px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
    }

    .mentor-styles {
      display: flex;
      gap: 10px;
    }

    .style-chip {
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      border: 1px solid var(--border-color);
      background: rgba(255, 255, 255, 0.03);
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.2s ease;
    }

    .style-chip.active, .style-chip:hover {
      border-color: var(--accent-primary);
      color: var(--text-main);
      background: rgba(236, 72, 153, 0.1);
    }

    .chat-viewport {
      flex: 1;
      overflow-y: auto;
      padding: 25px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .message-row {
      display: flex;
      gap: 15px;
      max-width: 80%;
    }

    .message-row.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .message-row.assistant {
      align-self: flex-start;
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      flex-shrink: 0;
    }

    .avatar.user {
      background: #3b82f6;
    }

    .avatar.assistant {
      background: var(--accent-gradient);
    }

    .message-bubble {
      padding: 14px 18px;
      border-radius: 14px;
      font-size: 0.95rem;
      line-height: 1.6;
      position: relative;
    }

    .message-row.user .message-bubble {
      background: #2563eb;
      color: #fff;
      border-top-right-radius: 2px;
    }

    .message-row.assistant .message-bubble {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      border-top-left-radius: 2px;
    }

    .input-area {
      padding: 20px;
      border-top: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .input-box {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 15px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      background: rgba(0, 0, 0, 0.2);
    }

    .input-box textarea {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      resize: none;
      height: 24px;
      max-height: 120px;
      font-size: 0.95rem;
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.1rem;
      cursor: pointer;
      padding: 8px;
      transition: color 0.2s ease;
    }

    .icon-btn:hover {
      color: var(--accent-primary);
    }

    .send-btn {
      background: var(--accent-gradient);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: opacity 0.2s ease;
    }

    .send-btn:hover {
      opacity: 0.9;
    }

    /* RIGHT METRICS PANEL */
    .metrics-panel {
      width: var(--right-panel-width);
      border-left: 1px solid var(--border-color);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      overflow-y: auto;
    }

    .panel-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .gauge-card {
      padding: 15px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border-color);
    }

    .gauge-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      margin-bottom: 8px;
    }

    .gauge-bar {
      height: 8px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.1);
      overflow: hidden;
      position: relative;
    }

    .gauge-fill {
      height: 100%;
      width: 0%;
      background: var(--accent-gradient);
      transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .radar-box {
      width: 100%;
      height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* AUDIO VISUALIZER */
    .audio-visualizer {
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      display: none;
    }

    /* TOAST NOTIFICATION */
    .toast-container {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 100;
    }

    .toast {
      background: #1f2937;
      color: #fff;
      padding: 12px 20px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      margin-top: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <!-- LEFT SIDEBAR -->
  <aside class="sidebar glass">
    <div class="brand-header">
      <div class="brand-icon"><i class="fa-solid fa-brain"></i></div>
      <div>
        <div class="brand-title">SABINA AI</div>
        <div style="font-size: 0.75rem; color: var(--text-muted);">Enterprise Psychological System</div>
      </div>
    </div>

    <button class="action-btn" onclick="createNewSession()">
      <i class="fa-solid fa-plus"></i> Жаңа Анализ
    </button>

    <div class="session-list" id="sessionList">
      <!-- Dynamically populated -->
    </div>

    <div style="padding: 15px; border-top: 1px solid var(--border-color);">
      <button class="action-btn" style="margin: 0; width: 100%; font-size: 0.85rem;" onclick="clearAllData()">
        <i class="fa-solid fa-trash"></i> Тарихты тазалау
      </button>
    </div>
  </aside>

  <!-- MAIN CHAT -->
  <main class="main-chat">
    <header class="chat-header glass">
      <div>
        <h3 id="chatTitle" style="font-size: 1rem;">Психологиялық Аналитикалық Сессия</h3>
        <p style="font-size: 0.75rem; color: var(--text-muted);">Статус: Бета-Режимде Белсенді</p>
      </div>

      <div class="mentor-styles">
        <div class="style-chip active" onclick="updateSystemPromptStyle('empathic')">Эмпатиялық</div>
        <div class="style-chip" onclick="updateSystemPromptStyle('analytical')">Аналитикалық</div>
        <div class="style-chip" onclick="updateSystemPromptStyle('leader')">Лидерлік Тон</div>
      </div>
    </header>

    <div class="chat-viewport" id="chatViewport">
      <!-- Messages rendered dynamically -->
    </div>

    <div class="input-area glass">
      <div class="audio-visualizer" id="audioVisualizerBox">
        <canvas id="audioCanvas" height="40"></canvas>
      </div>

      <div class="input-box">
        <button class="icon-btn" id="micBtn" onclick="toggleAudioRecorder()"><i class="fa-solid fa-microphone"></i></button>
        <textarea id="chatInput" placeholder="Хабарламаңызды жазыңыз немесе ситуацияны сипаттаңыз..." onkeypress="handleKeyPress(event)"></textarea>
        <button class="icon-btn" onclick="triggerDemoScenario()" title="Демо сценарийді іске қосу"><i class="fa-solid fa-wand-magic-sparkles"></i></button>
        <button class="send-btn" onclick="submitMessage()"><i class="fa-solid fa-paper-plane"></i></button>
      </div>
    </div>
  </main>

  <!-- RIGHT METRICS PANEL -->
  <aside class="metrics-panel glass">
    <div class="panel-title">Психометриялық Картограмма</div>

    <div class="radar-box">
      <canvas id="radarCanvas" width="220" height="220"></canvas>
    </div>

    <div class="panel-title" style="margin-top: 10px;">Детекторлар</div>

    <div class="gauge-card">
      <div class="gauge-header">
        <span>Лидерлік Деңгейі</span>
        <span id="leadershipVal">0%</span>
      </div>
      <div class="gauge-bar">
        <div class="gauge-fill" id="leadershipFill"></div>
      </div>
    </div>

    <div class="gauge-card">
      <div class="gauge-header">
        <span>Манипуляция Қаупі</span>
        <span id="toxicityVal">0%</span>
      </div>
      <div class="gauge-bar">
        <div class="gauge-fill" id="toxicityFill" style="background: linear-gradient(135deg, #f43f5e, #e11d48);"></div>
      </div>
    </div>

    <div class="gauge-card">
      <div class="gauge-header">
        <span>Эмоционалды Тұрақтылық</span>
        <span id="stabilityVal">0%</span>
      </div>
      <div class="gauge-bar">
        <div class="gauge-fill" id="stabilityFill" style="background: linear-gradient(135deg, #10b981, #059669);"></div>
      </div>
    </div>

    <button class="action-btn" style="margin-top: auto;" onclick="exportReport()">
      <i class="fa-solid fa-file-export"></i> Есепті Жүктеп Алу
    </button>
  </aside>

  <div class="toast-container" id="toastContainer"></div>

  <script>
    /* SYSTEM PROMPT & BASE CONFIG */
    const BASE_SYSTEM_PROMPT = `Сіз - Sabina AI, жоғары деңгейлі психолог, эмоционалды интеллект саласындағы эксперт және стратегиялық менторсыз. 
Сіздің міндетіңіз: Пайдаланушының мәселесін аналитикалық түрде талдау, эмоционалды манипуляцияларды табу, ішкі шекараларды сақтау бойынша нақты кеңес беру.

СІЗДІҢ ЖАУАБЫҢЫЗДЫҢ МІНДЕТТІ БӨЛІГІ:
Жауап соңында МІНДЕТТІ ТҮРДЕ мына сияқты психологиялық метрикаларды квадраттық жақшада көрсетіңіз:
[ЛИДЕРЛІК ДЕҢГЕЙІ: 75%]
[МАНИПУЛЯЦИЯ ҚАУПІ: 20%]
[ЭМОЦИОНАЛДЫ ТҰРАҚТЫЛЫҚ: 80%]`;

    let sessions = [];
    let activeSessionId = null;
    let selectedStyle = 'empathic';
    let isRecording = false;
    let audioAnimId = null;
    let radarChartInstance = null;

    /* CUSTOM RADAR CHART ENGINE (NO EXTERNAL DEPENDENCIES) */
    class CustomRadarChart {
      constructor(canvasId) {
        this.canvas = document.getElementById(canvasId);
        this.ctx = this.canvas.getContext('2d');
        this.labels = ['Эмоция', 'Лидерлік', 'Шекара', 'Тұрақтылық', 'Эмпатия'];
        this.values = [50, 50, 50, 50, 50];
      }

      updateValues(newValues) {
        this.values = newValues;
        this.draw();
      }

      draw() {
        const ctx = this.ctx;
        const width = this.canvas.width;
        const height = this.canvas.height;
        const centerX = width / 2;
        const centerY = height / 2;
        const radius = Math.min(width, height) / 2 - 30;

        ctx.clearRect(0, 0, width, height);

        // Draw web rings
        const numRings = 4;
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
        ctx.lineWidth = 1;

        for (let r = 1; r <= numRings; r++) {
          ctx.beginPath();
          const currentRadius = (radius / numRings) * r;
          for (let i = 0; i < 5; i++) {
            const angle = (Math.PI * 2 / 5) * i - Math.PI / 2;
            const x = centerX + currentRadius * Math.cos(angle);
            const y = centerY + currentRadius * Math.sin(angle);
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          ctx.closePath();
          ctx.stroke();
        }

        // Draw Axes & Labels
        ctx.fillStyle = '#9ca3af';
        ctx.font = '10px Plus Jakarta Sans';
        ctx.textAlign = 'center';

        for (let i = 0; i < 5; i++) {
          const angle = (Math.PI * 2 / 5) * i - Math.PI / 2;
          const x = centerX + radius * Math.cos(angle);
          const y = centerY + radius * Math.sin(angle);

          ctx.beginPath();
          ctx.moveTo(centerX, centerY);
          ctx.lineTo(x, y);
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
          ctx.stroke();

          // Labels
          const labelX = centerX + (radius + 18) * Math.cos(angle);
          const labelY = centerY + (radius + 18) * Math.sin(angle) + 3;
          ctx.fillText(this.labels[i], labelX, labelY);
        }

        // Draw Data Shape
        ctx.beginPath();
        for (let i = 0; i < 5; i++) {
          const angle = (Math.PI * 2 / 5) * i - Math.PI / 2;
          const valRadius = (radius * (this.values[i] / 100));
          const x = centerX + valRadius * Math.cos(angle);
          const y = centerY + valRadius * Math.sin(angle);
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();

        ctx.fillStyle = 'rgba(236, 72, 153, 0.25)';
        ctx.fill();
        ctx.strokeStyle = '#ec4899';
        ctx.lineWidth = 2;
        ctx.stroke();
      }
    }

    /* INITIALIZATION */
    window.onload = function() {
      radarChartInstance = new CustomRadarChart('radarCanvas');
      radarChartInstance.draw();
      loadFromLocalStorage();

      if (sessions.length === 0) {
        createNewSession();
      } else {
        switchSession(sessions[0].id);
      }
    };

    /* SESSION MANAGEMENT */
    function createNewSession() {
      const id = 'session_' + Date.now();
      const newSession = {
        id: id,
        title: 'Жаңа Сессия ' + (sessions.length + 1),
        history: [
          { role: 'system', content: BASE_SYSTEM_PROMPT }
        ],
        messages: [
          {
            sender: 'assistant',
            text: 'Сәлеметсіз бе! Мен Sabina AI психологиялық платформасымын. Сұрағыңызды немесе басыңыздан өтіп жатқан ситуацияны жазыңыз, біз оны психометриялық деңгейде талдаймыз.',
            time: getCurrentTime()
          }
        ]
      };

      sessions.unshift(newSession);
      activeSessionId = id;
      saveToLocalStorage();
      renderSidebar();
      renderChatMessages();
      showToast('Жаңа аналитикалық сессия ашылды');
    }

    function switchSession(id) {
      activeSessionId = id;
      renderSidebar();
      renderChatMessages();
    }

    function getCurrentSession() {
      return sessions.find(s => s.id === activeSessionId);
    }

    function renderSidebar() {
      const listContainer = document.getElementById('sessionList');
      listContainer.innerHTML = '';

      sessions.forEach(s => {
        const div = document.createElement('div');
        div.className = `session-item ${s.id === activeSessionId ? 'active' : ''}`;
        div.onclick = () => switchSession(s.id);
        div.innerHTML = `
          <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;"><i class="fa-regular fa-message" style="margin-right: 8px;"></i>${escapeHtml(s.title)}</span>
          <i class="fa-solid fa-xmark" style="font-size: 0.8rem; opacity: 0.5;" onclick="deleteSession(event, '${s.id}')"></i>
        `;
        listContainer.appendChild(div);
      });
    }

    function deleteSession(e, id) {
      e.stopPropagation();
      sessions = sessions.filter(s => s.id !== id);
      if (sessions.length === 0) {
        createNewSession();
      } else {
        if (activeSessionId === id) activeSessionId = sessions[0].id;
        saveToLocalStorage();
        renderSidebar();
        renderChatMessages();
      }
    }

    /* CHAT RENDER ENGINE */
    function renderChatMessages() {
      const viewport = document.getElementById('chatViewport');
      const session = getCurrentSession();
      if (!session) return;

      document.getElementById('chatTitle').innerText = session.title;
      viewport.innerHTML = '';

      session.messages.forEach(m => {
        const div = document.createElement('div');
        div.className = `message-row ${m.sender}`;
        div.innerHTML = `
          <div class="avatar ${m.sender}">
            <i class="fa-solid ${m.sender === 'user' ? 'fa-user' : 'fa-robot'}"></i>
          </div>
          <div class="message-bubble">
            <div>${escapeHtml(m.text).replace(/\n/g, '<br>')}</div>
            <div style="font-size: 0.7rem; color: var(--text-muted); margin-top: 5px; text-align: right;">${m.time}</div>
          </div>
        `;
        viewport.appendChild(div);
      });

      viewport.scrollTop = viewport.scrollHeight;
    }

    /* API REQUEST & CHAT LOGIC */
    async function submitMessage() {
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text) return;

      const session = getCurrentSession();
      if (!session) return;

      // Update session title if first user message
      if (session.messages.length <= 1) {
        session.title = text.substring(0, 20) + '...';
        renderSidebar();
      }

      // Add user message
      const userMsg = { sender: 'user', text: text, time: getCurrentTime() };
      session.messages.push(userMsg);
      session.history.push({ role: 'user', content: text });

      input.value = '';
      renderChatMessages();

      const typingId = showTypingIndicator();

      try {
        const response = await fetch('https://text.pollinations.ai/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            messages: session.history,
            model: 'openai'
          })
        });

        removeTypingIndicator(typingId);

        if (response.ok) {
          const aiResponseText = await response.text();

          const assistantMsg = { sender: 'assistant', text: aiResponseText, time: getCurrentTime() };
          session.messages.push(assistantMsg);
          session.history.push({ role: 'assistant', content: aiResponseText });

          renderChatMessages();
          parseAndAnimateMetrics(aiResponseText);
          saveToLocalStorage();
        } else {
          showToast('АПИ Қателігі: Жауап алу мүмкін болмады');
        }
      } catch (err) {
        removeTypingIndicator(typingId);
        showToast('Желілік қателік орын алды');
        console.error(err);
      }
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        submitMessage();
      }
    }

    /* TYPING INDICATOR */
    function showTypingIndicator() {
      const viewport = document.getElementById('chatViewport');
      const id = 'typing-' + Date.now();
      const div = document.createElement('div');
      div.id = id;
      div.className = 'message-row assistant';
      div.innerHTML = `
        <div class="avatar assistant"><i class="fa-solid fa-robot"></i></div>
        <div class="message-bubble" style="display: flex; gap: 8px; align-items: center;">
          <i class="fa-solid fa-circle-notch fa-spin" style="color: var(--accent-primary);"></i>
          <span style="font-size: 0.88rem; color: var(--text-muted);">Sabina AI талдап жатыр...</span>
        </div>
      `;
      viewport.appendChild(div);
      viewport.scrollTop = viewport.scrollHeight;
      return id;
    }

    function removeTypingIndicator(id) {
      const el = document.getElementById(id);
      if (el) el.remove();
    }

    /* METRICS PARSER & GAUGE ANIMATOR */
    function parseAndAnimateMetrics(text) {
      const leadMatch = text.match(/ЛИДЕРЛІК ДЕҢГЕЙІ:\s*\[?(\d+)%?\]?/i);
      const toxMatch = text.match(/МАНИПУЛЯЦИЯ ҚАУПІ:\s*\[?(\d+)%?\]?/i);
      const stabMatch = text.match(/ЭМОЦИОНАЛДЫ ТҰРАҚТЫЛЫҚ:\s*\[?(\d+)%?\]?/i);

      const lead = leadMatch ? parseInt(leadMatch[1]) : Math.floor(Math.random() * 30) + 60;
      const tox = toxMatch ? parseInt(toxMatch[1]) : Math.floor(Math.random() * 40) + 10;
      const stab = stabMatch ? parseInt(stabMatch[1]) : Math.floor(Math.random() * 30) + 65;

      updateGauge('leadershipFill', 'leadershipVal', lead);
      updateGauge('toxicityFill', 'toxicityVal', tox);
      updateGauge('stabilityFill', 'stabilityVal', stab);

      if (radarChartInstance) {
        radarChartInstance.updateValues([
          Math.min(100, stab + 10),
          lead,
          Math.min(100, 100 - tox),
          stab,
          Math.min(100, Math.round((lead + stab) / 2))
        ]);
      }
    }

    function updateGauge(fillId, valId, targetVal) {
      const fillEl = document.getElementById(fillId);
      const valEl = document.getElementById(valId);
      if (!fillEl || !valEl) return;

      fillEl.style.width = targetVal + '%';
      valEl.innerText = targetVal + '%';
    }

    /* MENTOR STYLE CONFIG */
    function updateSystemPromptStyle(style) {
      selectedStyle = style;
      
      document.querySelectorAll('.style-chip').forEach(chip => {
        chip.classList.remove('active');
      });
      event.target.classList.add('active');

      const session = getCurrentSession();
      if (!session) return;

      let stylePrefix = "";
      if (style === 'analytical') {
        stylePrefix = "\nҮН ДИЗАЙНЫ: Қатал, фактіге сүйенген, эмоционалды импульстарға жол бермейтін аналитикалық тон.";
      } else if (style === 'leader') {
        stylePrefix = "\nҮН ДИЗАЙНЫ: Абыройлы, ер мінезді, нақты лидерлік позицияны және ішкі шекараларды ұстануды талап ететін тон.";
      } else {
        stylePrefix = "\nҮН ДИЗАЙНЫ: Қолдаушы, эмпатиялық, психологиялық жайлылық сыйлайтын тон.";
      }

      session.history[0] = { role: 'system', content: BASE_SYSTEM_PROMPT + stylePrefix };
      showToast('Ментор стилі жаңартылды: ' + style);
    }

    /* VOICE / AUDIO VISUALIZER MOCK ENGINE */
    function toggleAudioRecorder() {
      const micBtn = document.getElementById('micBtn');
      const box = document.getElementById('audioVisualizerBox');
      const canvas = document.getElementById('audioCanvas');

      if (!isRecording) {
        isRecording = true;
        micBtn.style.color = 'var(--accent-primary)';
        box.style.display = 'flex';
        startWaveAnimation(canvas);
        showToast('Дауыстық жазба іске қосылды');
      } else {
        isRecording = false;
        micBtn.style.color = '';
        box.style.display = 'none';
        cancelAnimationFrame(audioAnimId);
        document.getElementById('chatInput').value = "Қазіргі қарым-қатынастағы эмоционалды салқындықты қалай еңсеруге болады?";
        showToast('Дауыс мәтінге айналдырылды');
      }
    }

    function startWaveAnimation(canvas) {
      const ctx = canvas.getContext('2d');
      let step = 0;

      function render() {
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.beginPath();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#ec4899';

        const width = canvas.width;
        const height = canvas.height;
        ctx.moveTo(0, height / 2);

        for (let i = 0; i < width; i++) {
          const y = Math.sin(i * 0.05 + step) * 12 * Math.sin(i * 0.01) + height / 2;
          ctx.lineTo(i, y);
        }

        ctx.stroke();
        step += 0.15;
        audioAnimId = requestAnimationFrame(render);
      }

      render();
    }

    /* DEMO SCENARIO TRIGGER */
    function triggerDemoScenario() {
      const input = document.getElementById('chatInput');
      input.value = "Қыз бала: 'Егер мені шынымен жақсы көрсең, бүгін достарыңмен кездесуге бармайсың.' Осы сөзге қалай сабырлы әрі шекараны сақтай отырып жауап берсем болады?";
      submitMessage();
    }

    /* REPORT EXPORT */
    function exportReport() {
      const session = getCurrentSession();
      if (!session || session.messages.length <= 1) {
        showToast('Экспорттау үшін алдымен диалог жүргізіңіз');
        return;
      }

      let reportText = `SABINA AI ENTERPRISE — ПСИХОЛОГИЯЛЫҚ ТАЛДАУ ЕСЕБІ\n`;
      reportText += `Күні: ${new Date().toLocaleDateString()}\n`;
      reportText += `==================================================\n\n`;

      session.messages.forEach(m => {
        reportText += `[${m.time}] ${m.sender.toUpperCase()}:\n${m.text}\n\n--------------------------------------------------\n`;
      });

      const blob = new Blob([reportText], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `Sabina_AI_Report_${Date.now()}.txt`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('Есеп жүктелді');
    }

    /* STORAGE & UTILS */
    function saveToLocalStorage() {
      localStorage.setItem('sabina_ai_sessions', JSON.stringify(sessions));
    }

    function loadFromLocalStorage() {
      const stored = localStorage.getItem('sabina_ai_sessions');
      if (stored) {
        try {
          sessions = JSON.parse(stored);
        } catch (e) {
          sessions = [];
        }
      }
    }

    function clearAllData() {
      if (confirm('Барлық сессиялар тарихын өшіруді растайсыз ба?')) {
        localStorage.removeItem('sabina_ai_sessions');
        sessions = [];
        createNewSession();
        showToast('Барлық жад тазаланды');
      }
    }

    function getCurrentTime() {
      const now = new Date();
      return now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, function (m) {
        return {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#039;'
        }[m];
      });
    }

    function showToast(message) {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.innerHTML = `<i class="fa-solid fa-circle-info" style="color: var(--accent-primary);"></i> <span>${escapeHtml(message)}</span>`;
      container.appendChild(toast);

      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(100%)';
        toast.style.transition = 'all 0.3s ease';
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }
  </script>
</body>
